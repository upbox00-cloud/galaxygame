    <meta charset="utf-8" />

    <title>Entrar | GalaxyGame</title>
    <meta name="description" content="Inicia sessao na tua conta GalaxyGame." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script src="scripts/recovery-token.js?v=20260811-2"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js" defer></script>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body class="admin-login-page">
    <main class="admin-login-main">
      <a class="admin-login-brand" href="index.html" aria-label="Voltar a GalaxyGame">
        <img src="assets/galaxygame-header-logo-cropped.webp" alt="GalaxyGame" />
      </a>

      <section class="admin-login-card" aria-labelledby="admin-login-title">
        <p class="account-kicker" data-login-kicker>Conta GalaxyGame</p>
        <h1 id="admin-login-title" data-login-title>Entrar na GalaxyGame</h1>
        <p data-login-copy>Acede aos teus pedidos e acompanha as tuas compras digitais.</p>

        <div class="admin-login-modes" data-login-modes aria-label="Escolher acesso">
          <button type="button" data-login-mode="login">Entrar</button>
          <button type="button" data-login-mode="signup">Criar conta</button>
        </div>

        <form class="admin-login-form" data-admin-login-form>
          <label data-admin-login-name-row hidden>
            Nome
            <input type="text" name="name" autocomplete="name" minlength="2" />
          </label>
          <label>
            Email
            <input type="email" name="email" autocomplete="username" inputmode="email" required />
          </label>
          <label>
            Palavra-passe
            <input type="password" name="password" autocomplete="current-password" minlength="8" required />
          </label>
          <p class="admin-login-status" data-admin-login-status role="alert" aria-live="polite"></p>
          <button type="submit" data-admin-login-submit>Entrar com seguranca</button>
        </form>

        <button class="admin-login-recovery" type="button" data-admin-login-recovery>Esqueci-me da palavra-passe</button>
        <a class="admin-login-back" href="index.html">Voltar a loja</a>
      </section>
    </main>
    <script src="admin-login.js?v=20260811-2" defer></script>
  </body>
</html>
