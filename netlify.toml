[build]
  command = "npm run prepare:netlify"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/*.json"]

[images]
  remote_images = [
    "https://media\\.rawg\\.io/.*",
    "https://cdn2\\.steamgriddb\\.com/.*",
    "https://acdn-us\\.mitiendanube\\.com/.*"
  ]

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Commercial costs are consumed by server functions only. The public catalog
# deliberately contains sale prices without supplier or competitor data.
[[redirects]]
  from = "/netlify/functions/_data/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/.internal/*"
  to = "/404.html"
  status = 404
  force = true
